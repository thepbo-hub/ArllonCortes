<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Página Não Encontrada | Arllon Fernandes Barbearia</title>
    <meta name="description" content="Página não encontrada no catálogo oficial da Arllon Fernandes Barbearia." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #020812;
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        text-align: center;
      }
      .card {
        background: #05162d;
        border: 1px solid rgba(22, 136, 255, 0.3);
        border-radius: 20px;
        padding: 40px 30px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      }
      .badge {
        display: inline-block;
        background: rgba(22, 136, 255, 0.2);
        color: #35a7ff;
        border: 1px solid rgba(22, 136, 255, 0.35);
        padding: 6px 14px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      h1 {
        font-family: 'Outfit', sans-serif;
        font-size: 26px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -0.5px;
        margin-bottom: 12px;
      }
      p {
        color: #b7c4d3;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: linear-gradient(90deg, #082e5a, #1688ff);
        color: #ffffff;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: 0 0 20px rgba(22, 136, 255, 0.4);
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(22, 136, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">Erro 404</span>
      <h1>Página Não Encontrada</h1>
      <p>O link que você acessou não existe no biosite da <strong>Arllon Fernandes Barbearia</strong>. Acesse nosso catálogo oficial e simulador de orçamento.</p>
      <a href="/" class="btn">Ir para o Catálogo Oficial</a>
    </div>
  </body>
</html>
